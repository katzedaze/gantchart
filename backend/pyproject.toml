[project]
name = "gantchart-backend"
version = "0.1.0"
description = "Backlog-like project management system with Gantt Chart - Backend API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "S",    # flake8-bandit (security)
  "T20",  # flake8-print
  "SIM",  # flake8-simplify
]
ignore = [
  "S101",  # allow assert in tests
  "B008",  # allow Depends() in function args (FastAPI pattern)
  "S104",  # allow binding to all interfaces (Docker)
  "UP046", # allow Generic[] subclass pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"alembic/**/*.py" = ["E501", "W291"]

[tool.ruff.format]
quote-style = "double"
